<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz Byte - Result</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f0ff;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .result-box {

            background: white;

            width: 90%;
            max-width: 500px;

            padding: 45px;

            text-align: center;

            border-radius: 25px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.12);
        }

        h1 {
            color: #6c4ab6;
        }

        .score {

            font-size: 55px;

            font-weight: bold;

            color: #38235f;

            margin: 25px 0;
        }

        .message {

            font-size: 20px;

            color: #555;

            margin-bottom: 30px;
        }

        .home-btn {

            display: inline-block;

            background: #6c4ab6;

            color: white;

            padding: 14px 30px;

            border-radius: 10px;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="result-box">

    <h1>🎉 ROUND 1 COMPLETED!</h1>

    <p>Your Score</p>

    <div class="score">

        {{ score }} / {{ total }}

    </div>

    {% if score >= 15 %}

        <div class="message">

            🎊 Congratulations!<br>
            You qualified for the next round.

        </div>

    {% else %}

        <div class="message">

            Thank you for participating!<br>
            Better luck next time.

        </div>

    {% endif %}


    <a href="/" class="home-btn">
        BACK TO HOME
    </a>

</div>


</body>

</html>
