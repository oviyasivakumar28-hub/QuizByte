<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Byte | ACET</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eee7ff, #ffffff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-box {
            width: 90%;
            max-width: 850px;
            background: white;
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .college {
            color: #6c4ab6;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .logo {
            font-size: 52px;
            margin-bottom: 5px;
        }

        h1 {
            margin: 0;
            color: #38235f;
            font-size: 48px;
        }

        .subtitle {
            font-size: 20px;
            color: #666;
            margin-top: 10px;
        }

        .symposium {
            display: inline-block;
            margin: 20px 0;
            padding: 10px 22px;
            background: #eee7ff;
            color: #6c4ab6;
            border-radius: 25px;
            font-weight: bold;
        }

        .rounds {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .round {
            width: 200px;
            padding: 20px;
            background: #f7f4ff;
            border-radius: 15px;
        }

        .round h3 {
            color: #6c4ab6;
            margin: 5px 0 10px;
        }

        .round p {
            color: #555;
            margin: 5px;
        }

        .start-btn {
            display: inline-block;
            padding: 16px 45px;
            background: #6c4ab6;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }

        .start-btn:hover {
            background: #50358e;
        }
    </style>
</head>

<body>

    <div class="main-box">

        <div class="college">
            ACHARIYA COLLEGE OF ENGINEERING TECHNOLOGY
        </div>

        <div class="logo">🧠</div>

        <h1>QUIZ BYTE</h1>

        <div class="subtitle">
            Technical Quiz Challenge
        </div>

        <div class="symposium">
            SYMPOSIUM 2026
        </div>

        <div class="rounds">

            <div class="round">
                <h3>ROUND 1</h3>
                <p>30 Questions</p>
                <p>30 Minutes</p>
            </div>

            <div class="round">
                <h3>ROUND 2</h3>
                <p>15 Questions</p>
                <p>20 Minutes</p>
            </div>

            <div class="round">
                <h3>FINAL ROUND</h3>
                <p>10 Questions</p>
                <p>15 Minutes</p>
            </div>

        </div>

        <a href="/register" class="start-btn">
            START QUIZ →
        </a>

    </div>

</body>
</html>
